services:
  - type: web
    name: edusense-iot-dashboard
    env: node
    plan: free
    buildCommand: npm install && cd client && npm install && cd ../server && npm install && cd .. && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: "*"
