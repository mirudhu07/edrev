services:
  - type: web
    name: edusense-iot-dashboard
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.17.1
      - key: ALLOWED_ORIGIN
        value: "*"
